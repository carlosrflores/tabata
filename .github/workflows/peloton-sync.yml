name: Peloton sync

# Runs the Tabata Tuesday sync from a GitHub Actions runner. GitHub's
# Azure egress range is currently unblocked by Peloton's Cloudflare WAF,
# unlike Vercel Lambda — see docs/tabata-tuesday-hardening-brief.md
# section 3. This is the only sync cron — the temporary Vercel backup
# cron was removed once runs here proved stable.

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      trigger:
        description: 'sync_runs trigger label (cron|manual|backfill)'
        required: false
        default: 'manual'
        type: string
      member_id:
        description: 'Sync only this member (uuid). Blank = all members.'
        required: false
        default: ''
        type: string

# Prevent overlap if a manual dispatch fires while the scheduled run is
# still going. Don't cancel the in-progress run — let it finish.
concurrency:
  group: peloton-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Run sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Inputs pass through env (not inline expressions) so they can't inject shell.
          SYNC_TRIGGER: ${{ inputs.trigger || 'cron' }}
          SYNC_MEMBER_ID: ${{ inputs.member_id }}
        run: npx tsx scripts/run-sync.ts "$SYNC_TRIGGER" "$SYNC_MEMBER_ID"
